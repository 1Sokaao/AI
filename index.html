<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安居记账 · 房屋收支管理</title>
<style>
  :root{
    --primary:#0d9488; --primary-dark:#0f766e; --primary-light:#ccfbf1;
    --income:#059669; --income-bg:#d1fae5;
    --expense:#e11d48; --expense-bg:#ffe4e6;
    --warn:#d97706; --warn-bg:#fef3c7;
    --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
    --line:#e2e8f0; --bg:#f4f6f8; --card:#ffffff;
    --sidebar:#0f2027; --sidebar-2:#14323b;
    --track:#f1f5f9; --soft:#f8fafc; --hover:#f1f5f9; --input-bg:#ffffff;
    --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  a{color:var(--primary);text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}

  /* ---------- 布局 ---------- */
  #app{display:flex;min-height:100vh}
  .sidebar{width:224px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40}
  .logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:700;letter-spacing:1px}
  .logo .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0d9488);display:grid;place-items:center;font-size:19px;box-shadow:0 4px 12px rgba(20,184,166,.4)}
  .logo small{display:block;font-size:11px;font-weight:400;color:#7dd3c8;letter-spacing:2px;margin-top:1px}
  .nav{padding:8px 12px;flex:1}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;border-radius:10px;color:#b6c6ce;font-weight:500;margin-bottom:3px;transition:.15s;text-align:left}
  .nav-item .ico{width:20px;text-align:center;font-size:16px}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:linear-gradient(90deg,rgba(20,184,166,.25),rgba(20,184,166,.08));color:#fff;box-shadow:inset 3px 0 0 #2dd4bf}
  .nav-foot{padding:16px;font-size:12px;color:#5f7d86;border-top:1px solid rgba(255,255,255,.07)}
  .main{flex:1;margin-left:224px;display:flex;flex-direction:column;min-width:0}
  .topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:30}
  .topbar h1{font-size:19px;font-weight:700}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .content{padding:26px 28px 48px;max-width:1280px;width:100%}

  /* ---------- 组件 ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s;border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(13,148,136,.28)}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:var(--input-bg);border-color:var(--line);color:var(--ink-2)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-danger{background:var(--input-bg);border-color:#fecdd3;color:var(--expense)}
  .btn-danger:hover{background:var(--expense);color:#fff;border-color:var(--expense)}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn-text{color:var(--muted);padding:4px 7px;border-radius:7px;font-size:12.5px}
  .btn-text:hover{background:var(--hover);color:var(--ink)}
  .btn-text.del:hover{background:var(--expense-bg);color:var(--expense)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card-b{padding:18px 20px}

  .grid{display:grid;gap:16px}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-23{grid-template-columns:2fr 1fr}
  .g-11{grid-template-columns:1fr 1fr}
  .mt-16{margin-top:16px}

  .kpi{padding:18px 19px;position:relative;overflow:hidden}
  .kpi .k-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .k-val{font-size:25px;font-weight:800;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .kpi .k-sub{font-size:12px;color:var(--faint);margin-top:5px}
  .kpi .k-ico{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
  .kpi.in .k-ico{background:var(--income-bg)} .kpi.in .k-val{color:var(--income)}
  .kpi.out .k-ico{background:var(--expense-bg)} .kpi.out .k-val{color:var(--expense)}
  .kpi.net .k-ico{background:var(--primary-light)} .kpi.net .k-val{color:var(--primary-dark)}
  .kpi.asset .k-ico{background:#e0e7ff}

  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .tag.in{background:var(--income-bg);color:var(--income)}
  .tag.out{background:var(--expense-bg);color:var(--expense)}
  .tag.gray{background:var(--hover);color:var(--muted)}
  .tag.blue{background:#dbeafe;color:#1d4ed8}
  .tag.amber{background:var(--warn-bg);color:var(--warn)}
  .tag.teal{background:var(--primary-light);color:var(--primary-dark)}
  .tag.purple{background:#f3e8ff;color:#7e22ce}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* 表格 */
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--hover);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--soft)}
  .num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
  .num.in{color:var(--income)} .num.out{color:var(--expense)}
  .cat-cell{display:flex;align-items:center;gap:9px}
  .cat-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:#fff;flex-shrink:0}

  /* 筛选条 */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600}
  .input,.select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);outline:none;transition:.15s;min-width:0}
  .input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
  .filters .input,.filters .select{min-width:130px}
  .filters .search{min-width:200px}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.3);animation:pop .18s}
  .modal.wide{max-width:640px}
  .m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0}
  .m-head h3{font-size:16px;font-weight:700}
  .m-x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;display:grid;place-items:center}
  .m-x:hover{background:var(--hover);color:var(--ink)}
  .m-body{padding:20px 22px}
  .m-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--card);border-radius:0 0 16px 16px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  .f-item{display:flex;flex-direction:column;gap:6px}
  .f-item label{font-size:12.5px;color:var(--ink-2);font-weight:600}
  .f-item label em{color:var(--expense);font-style:normal;margin-left:2px}
  .f-item .input,.f-item .select,.f-item textarea{width:100%}
  textarea.input{resize:vertical;min-height:64px}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;padding:9px;font-weight:600;font-size:13.5px;background:var(--input-bg);color:var(--muted)}
  .seg button.on-in{background:#059669;color:#fff}
  .seg button.on-out{background:#e11d48;color:#fff}

  /* 提示 / 空状态 */
  .toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#0f172a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(15,23,42,.3);animation:pop .2s}
  .toast.ok{background:#065f46} .toast.err{background:#9f1239}
  .empty{text-align:center;padding:48px 20px;color:var(--faint)}
  .empty .e-ico{font-size:42px;margin-bottom:12px}
  .empty p{margin-bottom:16px;font-size:13.5px}

  /* 房产卡片 */
  .prop-card{padding:19px;display:flex;flex-direction:column;gap:13px;transition:.15s}
  .prop-card:hover{box-shadow:0 6px 22px rgba(15,23,42,.09);transform:translateY(-2px)}
  .prop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .prop-name{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .prop-addr{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
  .prop-meta{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .prop-meta b{color:var(--ink);font-weight:600}
  .prop-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soft);border-radius:10px;padding:12px}
  .prop-stats div{text-align:center}
  .prop-stats .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .prop-stats .l{font-size:11px;color:var(--faint);margin-top:2px}
  .prop-actions{display:flex;gap:8px}

  /* 租客行 */
  .tenant-row{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--hover)}
  .tenant-row:last-child{border-bottom:none}
  .avatar{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#5eead4,#0d9488);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
  .tenant-info{flex:1;min-width:0}
  .tenant-info .n{font-weight:600;font-size:13.5px}
  .tenant-info .d{font-size:12px;color:var(--muted);margin-top:2px}

  /* 图表 */
  .legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .legend-row .ld{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .legend-row .ln{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-row .lv{font-weight:600;font-variant-numeric:tabular-nums}
  .legend-row .lp{color:var(--faint);width:42px;text-align:right}
  .chart-wrap{width:100%;overflow-x:auto}
  svg text{font-family:inherit}

  .summary-bar{display:flex;gap:22px;flex-wrap:wrap;padding:13px 18px;background:var(--soft);border-radius:11px;margin-bottom:14px;font-size:13px}
  .summary-bar b{font-variant-numeric:tabular-nums}
  .mini-note{font-size:12px;color:var(--faint)}

  .sett-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px dashed var(--line)}
  .sett-row:last-child{border-bottom:none}
  .sett-row .t{font-weight:600} .sett-row .d{font-size:12px;color:var(--muted);margin-top:3px}

  .quick-type{display:flex;gap:8px;flex-wrap:wrap}
  .quick-type button{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--input-bg);font-size:12.5px;color:var(--muted);font-weight:500}
  .quick-type button.sel{background:var(--primary-light);border-color:#5eead4;color:var(--primary-dark);font-weight:600}

  /* 锁屏 / 抄表 / 房贷计划 */
  #lockOverlay{position:fixed;inset:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));z-index:100;display:flex;align-items:center;justify-content:center;animation:fade .2s}
  .lock-card{background:var(--card);border-radius:18px;padding:34px 30px 26px;width:320px;max-width:92vw;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .lock-card .input{text-align:center;letter-spacing:2px}
  .lock-err{color:var(--expense);font-size:12.5px;margin-top:10px;min-height:18px}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .shake{animation:shake .35s}
  .meter-row{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;align-items:end;padding:13px 0;border-bottom:1px dashed var(--line)}
  .meter-row:last-child{border-bottom:none}
  .meter-row .mk{grid-column:1/-1;font-weight:600}
  .meter-calc{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
  .meter-calc b{color:var(--ink)}
  .sched-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .sched-wrap th{position:sticky;top:0}
  @media(max-width:860px){.meter-row{grid-template-columns:1fr 1fr}.sched-wrap{max-height:280px}}

  /* ---------- 深色模式 ---------- */
  body[data-theme="dark"]{
    --bg:#0b1220;--card:#131c2e;--ink:#e6edf6;--ink-2:#c9d4e3;--muted:#93a4ba;--faint:#6b7f99;
    --line:#25344e;--track:#1c2942;--soft:#182338;--hover:#20304d;--input-bg:#0e1830;
    --income:#34d399;--income-bg:#0c3a2c;--expense:#fb7185;--expense-bg:#3b1425;
    --warn:#fbbf24;--warn-bg:#3b2c0e;--primary-light:#0f3d38;--primary-dark:#2dd4bf;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
  }
  body[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#334155}
  body[data-theme="dark"] .topbar{background:rgba(19,28,46,.88)}
  body[data-theme="dark"] .toast{background:#334155}
  body[data-theme="dark"] .tag.blue{background:#1e3a8a;color:#93c5fd}
  body[data-theme="dark"] .tag.purple{background:#4c1d95;color:#d8b4fe}
  body[data-theme="dark"] .kpi.asset .k-ico{background:#312e81}
  body[data-theme="dark"] .quick-type button.sel{border-color:#0f766e}

  @media(max-width:1080px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}.g-23{grid-template-columns:1fr}}
  @media(max-width:860px){
    .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;background:var(--sidebar)}
    .logo,.nav-foot{display:none}
    .nav{display:flex;padding:4px;gap:2px;width:100%;justify-content:space-around}
    .nav-item{flex-direction:column;gap:3px;padding:7px 4px;margin:0;font-size:10.5px;justify-content:center;flex:1}
    .nav-item .ico{font-size:18px}
    .nav-item.active{box-shadow:inset 0 3px 0 #2dd4bf;border-radius:8px}
    .main{margin-left:0}
    .content{padding:16px 14px 84px}
    .topbar{padding:12px 16px}
    .g-4{grid-template-columns:1fr 1fr;gap:10px}.g-11{grid-template-columns:1fr}
    .kpi .k-val{font-size:20px}
    .form-grid{grid-template-columns:1fr}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><span class="mark">🏠</span><div>安居记账<small>HOUSE LEDGER</small></div></div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span class="ico">📊</span>收支概览</button>
      <button class="nav-item" data-view="records"><span class="ico">📒</span>收支明细</button>
      <button class="nav-item" data-view="properties"><span class="ico">🏢</span>房产租约</button>
      <button class="nav-item" data-view="reports"><span class="ico">📈</span>统计报表</button>
      <button class="nav-item" data-view="settings"><span class="ico">⚙️</span>数据管理</button>
    </nav>
    <div class="nav-foot">数据保存在本机浏览器<br>请勿在公共电脑使用
      <button id="lockBtn" onclick="lockNow()" style="display:none;margin-top:10px;width:100%;padding:7px 0;border-radius:8px;background:rgba(255,255,255,.08);color:#cbd5e1;font-size:12.5px">🔒 锁定</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">收支概览</h1><div class="sub" id="pageSub"></div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="themeBtn" data-action="toggleTheme" title="切换深色 / 浅色模式">🌙</button>
        <button class="btn btn-ghost" data-action="quickIn">＋ 收入</button>
        <button class="btn btn-primary" data-action="quickOut">－ 记支出</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>

<script>
/* ================================================================
   安居记账 —— 房屋收支管理
   数据结构：
   properties  房产 {id,name,addr,type,area,buyPrice,buyDate,status,note}
   tenants     租客 {id,propertyId,name,phone,rent,deposit,start,end,note}
   transactions 收支 {id,propertyId,type,cat,amount,date,method,note,createdAt}
   meters      抄表 {id,propertyId,kind,date,value,rate,amount}
   bills       周期账单 {id,propertyId,type,cat,amount,day,name,method,active,lastRun:'YYYY-MM'}
   budgets     月度预算 {支出分类id: 月度金额}
   ================================================================ */
const STORE_KEY='anju_ledger_v1';

/* ---------------- 分类配置 ---------------- */
const CATS={
  income:[
    {id:'rent',name:'租金',icon:'💰',color:'#059669'},
    {id:'deposit',name:'押金',icon:'🔒',color:'#10b981'},
    {id:'subsidy',name:'补贴/报销',icon:'🎁',color:'#34d399'},
    {id:'other_in',name:'其他收入',icon:'📥',color:'#6ee7b7'}
  ],
  expense:[
    {id:'mortgage',name:'房贷月供',icon:'🏦',color:'#e11d48'},
    {id:'rent_out',name:'付房东租金',icon:'🔑',color:'#b45309'},
    {id:'property_fee',name:'物业费',icon:'🧾',color:'#f97316'},
    {id:'water',name:'水费',icon:'💧',color:'#0284c7'},
    {id:'electric',name:'电费',icon:'⚡',color:'#ca8a04'},
    {id:'gas',name:'燃气费',icon:'🔥',color:'#7c3aed'},
    {id:'internet',name:'网络/电视',icon:'📶',color:'#0891b2'},
    {id:'repair',name:'维修保养',icon:'🔧',color:'#db2777'},
    {id:'decorate',name:'装修支出',icon:'🎨',color:'#9333ea'},
    {id:'appliance',name:'家电家具',icon:'🛋️',color:'#4f46e5'},
    {id:'insurance',name:'保险费',icon:'🛡️',color:'#0d9488'},
    {id:'tax',name:'税费',icon:'📋',color:'#57534e'},
    {id:'other_out',name:'其他支出',icon:'📤',color:'#94a3b8'}
  ]
};

function syncRentBill(prop){
  db.bills=db.bills||[];
  const old=db.bills.find(b=>b.autoRent===prop.id);
  if(prop.nature!=='rent'||!(+prop.rent>0)){
    if(old)db.bills=db.bills.filter(b=>b!==old);
    return;
  }
  const day=Math.min(28,Math.max(1,+prop.rentDay||1));
  if(old)Object.assign(old,{propertyId:prop.id,type:'expense',cat:'rent_out',amount:+prop.rent,day,name:'房租·房东',active:true});
  else db.bills.push({id:uid(),propertyId:prop.id,type:'expense',cat:'rent_out',amount:+prop.rent,day,
    name:'房租·房东',method:'银行卡',active:true,lastRun:ym(today()),autoRent:prop.id});
}

/* ================================================================
   v1.1 新增：房贷摊销 / 抄表算费 / 密码锁 / Excel 导出
   ================================================================ */
function loanCalc(p){
  const P=parseFloat(p.loanAmount),r=(parseFloat(p.loanRate)||0)/100/12,n=Math.round((parseFloat(p.loanYears)||0)*12);
  if(!(P>0)||!(n>0))return null;
  const start=(p.loanStart||today()).slice(0,7);
  const sp=start.split('-'),sy=+sp[0],sm=+sp[1];
  const rows=[];let bal=P;
  const dstr=i=>{const d=new Date(sy,sm-1+i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  if(p.loanMode==='principal'){
    const pp=P/n;
    for(let i=1;i<=n;i++){const it=bal*r;bal-=pp;rows.push({no:i,date:dstr(i),pay:pp+it,it,pp,bal:Math.max(bal,0)})}
  }else{
    const M=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    for(let i=1;i<=n;i++){const it=bal*r,pp=M-it;bal-=pp;rows.push({no:i,date:dstr(i),pay:M,it,pp,bal:Math.max(bal,0)})}
  }
  return{rows,pay0:rows[0].pay,totalIt:rows.reduce((s,x)=>s+x.it,0)};
}
function showLoanModal(pid){
  const p=db.properties.find(x=>x.id===pid);if(!p)return;
  const c=loanCalc(p);
  if(!c){toast('该房产尚未配置完整的房贷信息','err');return}
  const modeName=p.loanMode==='principal'?'等额本金':'等额本息';
  openModal(`<div class="modal wide">
    <div class="m-head"><h3>🏦 房贷还款计划 · ${esc(p.name)}</h3><button class="m-x" onclick="closeModal()">×</button></div>
    <div class="m-body">
      <div class="summary-bar" style="margin-bottom:12px">
        <span>贷款本金 <b>${money(p.loanAmount)}</b></span>
        <span>年利率 <b>${p.loanRate}%</b></span>
        <span>期限 <b>${p.loanYears}年 / ${c.rows.length}期</b></span>

/* ---------------- 密码锁 ---------------- */
async function hashPwd(p){
  const s='anju·'+p;
  try{
    if(window.crypto&&crypto.subtle&&window.isSecureContext){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return 's:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return 'f:'+(h>>>0).toString(16);
}
function showLock(){
  const old=document.getElementById('lockOverlay');if(old)old.remove();
  const o=document.createElement('div');o.id='lockOverlay';
  o.innerHTML=`<div class="lock-card" id="lockCard">
    <div style="width:52px;height:52px;font-size:26px;margin:0 auto 14px;background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(20,184,166,.4)">🏠</div>
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">安居记账已锁定</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:18px">请输入密码解锁查看数据</div>
    <input class="input" id="lockPwd" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" id="lockGo" style="width:100%;margin-top:12px;justify-content:center">解 锁</button>
    <div class="lock-err" id="lockErr"></div></div>`;
  document.body.appendChild(o);
  const go=async()=>{
    const inp=document.getElementById('lockPwd'),err=document.getElementById('lockErr');
    if(await hashPwd(inp.value)===lockCfg.hash){o.remove();render()}
    else{err.textContent='密码错误，请重试';inp.value='';inp.focus();
      const c=document.getElementById('lockCard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  };
  o.querySelector('#lockGo').onclick=go;
  o.querySelector('#lockPwd').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  setTimeout(()=>o.querySelector('#lockPwd').focus(),60);
}

function runAutoBills(){
  if(!db.bills||!db.bills.length)return;
  const cur=ym(today()),dd=new Date().getDate(),p2=x=>String(x).padStart(2,'0');
  let changed=false,n=0;
  db.bills.forEach(b=>{
    if(b.active===false)return;
    if(!db.properties.some(p=>p.id===b.propertyId))return;
    let last=b.lastRun||'';
    if(!last){b.lastRun=cur;changed=true;return}
    if(last>=cur)return;
    let guard=0;
    while(last<cur&&guard<48){
      const[y,m]=last.split('-').map(Number);
      const nx=new Date(y,m,1);
      const nm=nx.getFullYear()+'-'+p2(nx.getMonth()+1);
      if(nm>cur)break;
      if(nm===cur&&b.day>dd)break;
      db.transactions.push({id:uid(),propertyId:b.propertyId,type:b.type,cat:b.cat,amount:+b.amount||0,
        date:nm+'-'+p2(b.day),method:b.method||'其他',note:(b.name||CAT_MAP[b.cat]?.name||'周期账单')+'（自动记账）',createdAt:Date.now()});
      n++;last=nm;guard++;
    }
    if(last!==b.lastRun){b.lastRun=last;changed=true}
  });
  if(changed){save();if(n)toast('🔁 已自动记入 '+n+' 笔周期账单','ok')}
}
function billNextText(b){
  const cur=ym(today()),p2=x=>String(x).padStart(2,'0');
  const nm=s=>{const[y,m]=s.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
  if(b.lastRun&&b.lastRun>=cur)return '下次 '+nm(b.lastRun)+'-'+p2(b.day);
  return b.day<=new Date().getDate()?'今日将自动记账':cur+'-'+p2(b.day);
}

  const cur=ym(today());
  const got=db.transactions.filter(x=>x.propertyId===t.propertyId&&x.type==='income'&&x.cat==='rent'&&ym(x.date)===cur)
    .reduce((s,x)=>s+ +x.amount,0);
  let rentState='wait';
  if(got>=t.rent)rentState='paid';else if(got>0)rentState='partial';
  let lease='active';
  if(t.end){const dd=daysBetween(today(),t.end);if(dd<0)lease='expired';else if(dd<=30)lease='soon'}
  return{got,rentState,lease};
}

/* ================================================================

   ================================================================ */
function barChart(months,incomeArr,expArr){
  const W=640,H=260,PL=46,PR=12,PT=18,PB=34;
  const cw=W-PL-PR,ch=H-PT-PB;
  const max=Math.max(1,...incomeArr,...expArr);
  const niceMax=Math.ceil(max/1000)*1000||1000;
  const group=cw/months.length,bw=Math.min(15,group/4);
  let g='';
  [0,.25,.5,.75,1].forEach(r=>{const y=PT+ch-ch*r;
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" style="stroke:var(--track)"/>
        <text x="${PL-7}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${niceMax*r>=10000?(niceMax*r/10000)+'万':Math.round(niceMax*r)}</text>`});
  months.forEach((m,i)=>{
    const cx=PL+group*i+group/2;
    const ih=ch*incomeArr[i]/niceMax,eh=ch*expArr[i]/niceMax;
    g+=`<rect x="${cx-bw-2}" y="${PT+ch-ih}" width="${bw}" height="${ih}" rx="3" fill="#10b981"><title>${m} 收入 ${money(incomeArr[i])}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${PT+ch-eh}" width="${bw}" height="${eh}" rx="3" fill="#fb7185"><title>${m} 支出 ${money(expArr[i])}</title></rect>`;
    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11" fill="#64748b">${+m.slice(5)}月</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:520px;width:100%">${g}
    <rect x="${W-PR-150}" y="2" width="10" height="10" rx="2" fill="#10b981"/><text x="${W-PR-134}" y="11" font-size="11" fill="#64748b">收入</text>
    <rect x="${W-PR-90}" y="2" width="10" height="10" rx="2" fill="#fb7185"/><text x="${W-PR-74}" y="11" font-size="11" fill="#64748b">支出</text>
  </svg></div>`;
}
function donut(data){ // [{name,value,color}]
  const total=data.reduce((s,x)=>s+x.value,0);
  const size=180,cx=90,cy=90,r=68,sw=22;
  if(!total)return `<div style="text-align:center;color:#94a3b8;padding:36px 0"><div style="font-size:34px">🍃</div><div style="margin-top:8px;font-size:13px">本月暂无支出</div></div>`;
  let a0=-Math.PI/2,rings='';
  data.forEach(d=>{
    const a1=a0+d.value/total*Math.PI*2;
    const large=a1-a0>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    rings+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}" fill="none" stroke="${d.color}" stroke-width="${sw}"><title>${d.name} ${money(d.value)}</title></path>`;
    a0=a1;
  });
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 ${size} ${size}" style="width:160px">${rings}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="11" fill="#94a3b8">支出合计</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--ink)">${total>=10000?(total/10000).toFixed(1)+'万':Math.round(total)}</text>
    </svg>
    <div class="legend" style="flex:1;min-width:150px">
      ${data.sort((a,b)=>b.value-a.value).slice(0,7).map(d=>`<div class="legend-row">
        <span class="ld" style="background:${d.color}"></span><span class="ln">${d.name}</span>
        <span class="lv">${money(d.value)}</span><span class="lp">${(d.value/total*100).toFixed(0)}%</span></div>`).join('')}
    </div></div>`;
}

/* ================================================================
   视图：统计报表
   ================================================================ */
function renderReports(){
  const yearList=db.transactions.map(t=>+t.date.slice(0,4));
  const minY=Math.min(reportYear,...(yearList.length?yearList:[reportYear])),
        maxY=Math.max(reportYear,...(yearList.length?yearList:[reportYear]));
  let years=[];for(let y=maxY;y>=minY;y--)years.push(y);
  if(!years.includes(reportYear))years.unshift(reportYear);

  let list=db.transactions.filter(t=>+t.date.slice(0,4)===reportYear);
  if(reportProp)list=list.filter(t=>t.propertyId===reportProp);
  const total=monthStats(list);

  const months=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
  const incM=months.map(m=>monthStats(list.filter(t=>t.date.slice(5,7)===m)).income);
  const expM=months.map(m=>monthStats(list.filter(t=>t.date.slice(5,7)===m)).expense);
  const labels=months.map(m=>reportYear+'-'+m);

  const catRows=CATS.expense.map(c=>{const v=list.filter(t=>t.type==='expense'&&t.cat===c.id).reduce((s,t)=>s+ +t.amount,0);
    return{...c,v}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const catInRows=CATS.income.map(c=>{const v=list.filter(t=>t.type==='income'&&t.cat===c.id).reduce((s,t)=>s+ +t.amount,0);
    return{...c,v}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maxCat=Math.max(1,...catRows.map(x=>x.v));

  const propRows=db.properties.map(p=>{
    const s=monthStats(list.filter(t=>t.propertyId===p.id));
    return{p,...s};
  }).filter(r=>r.income||r.expense).sort((a,b)=>b.net-a.net);

  document.getElementById('view').innerHTML=`
    <div class="card"><div class="card-b">
      <div class="filters">
        <div class="field"><label>统计年份</label><select class="select" id="rpYear">
          ${years.map(y=>`<option ${y===reportYear?'selected':''}>${y}</option>`).join('')}</select></div>
        <div class="field"><label>房产范围</label><select class="select" id="rpProp">
          <option value="">全部房产</option>${db.properties.map(p=>`<option value="${p.id}" ${reportProp===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      </div></div></div>

    <div class="grid g-4 mt-16">
      <div class="card kpi in"><div class="k-ico">📈</div><div class="k-label">${reportYear} 全年收入</div><div class="k-val" style="font-size:22px">${money(total.income)}</div></div>
      <div class="card kpi out"><div class="k-ico">📉</div><div class="k-label">${reportYear} 全年支出</div><div class="k-val" style="font-size:22px">${money(total.expense)}</div></div>
      <div class="card kpi net"><div class="k-ico">💵</div><div class="k-label">年度净收益</div><div class="k-val" style="font-size:22px">${money(total.net)}</div></div>
      <div class="card kpi asset"><div class="k-ico">📅</div><div class="k-label">月均净收益</div><div class="k-val" style="font-size:22px">${money(total.net/12)}</div></div>
    </div>

    <div class="card mt-16"><div class="card-h"><h3>📊 ${reportYear} 年度月度趋势</h3></div>
      <div class="card-b">${list.length?barChart(labels,incM,expM):emptyChart()}</div></div>

    <div class="grid g-11 mt-16">
      <div class="card"><div class="card-h"><h3>🔻 支出分类排行</h3></div>
        <div class="card-b">${catRows.length?catRows.map(c=>`
          <div style="margin-bottom:13px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
              <span>${c.icon} ${c.name}</span><b style="font-variant-numeric:tabular-nums">${money(c.v)} · ${(c.v/total.expense*100).toFixed(1)}%</b></div>
            <div style="height:8px;background:var(--track);border-radius:6px;overflow:hidden">
              <div style="height:100%;width:${(c.v/maxCat*100).toFixed(1)}%;background:${c.color};border-radius:6px"></div></div>
          </div>`).join(''):'<div class="mini-note">本年暂无支出记录</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>🔺 收入来源构成</h3></div>
        <div class="card-b">${catInRows.length?catInRows.map(c=>`
          <div class="legend-row" style="margin-bottom:11px">
            <span class="ld" style="background:${c.color}"></span><span class="ln">${c.icon} ${c.name}</span>
            <span class="lv">${money(c.v)}</span><span class="lp">${(c.v/total.income*100).toFixed(0)}%</span></div>`).join('')
          :'<div class="mini-note">本年暂无收入记录</div>'}</div></div>
    </div>

    <div class="card mt-16"><div class="card-h"><h3>🏢 各房产年度对比</h3></div>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>房产</th><th style="text-align:right">年收入</th><th style="text-align:right">年支出</th><th style="text-align:right">年净收益</th><th style="text-align:right">收益率占比</th>
      </tr></thead><tbody>
      ${propRows.length?propRows.map(r=>`<tr>
        <td><b>🏠 ${esc(r.p.name)}</b></td>
        <td class="num in">${money(r.income)}</td><td class="num out">${money(r.expense)}</td>
        <td class="num" style="color:${r.net>=0?'var(--primary-dark)':'var(--expense)'}">${money(r.net)}</td>
        <td class="num">${total.net>0?(r.net/total.net*100).toFixed(1):'0.0'}%</td></tr>`).join(''):
        `<tr><td colspan="5"><div class="empty" style="padding:30px"><p>暂无数据</p></div></td></tr>`}
      </tbody></table></div></div>`;

  document.getElementById('rpYear').onchange=e=>{reportYear=+e.target.value;renderReports()};
  document.getElementById('rpProp').onchange=e=>{reportProp=e.target.value;renderReports()};
}

  a.href=URL.createObjectURL(blob);
  a.download='安居记账备份_'+today()+'.json';
  a.click();URL.revokeObjectURL(a.href);toast('已导出备份文件','ok');
}

/* ---------------- 路由 & 渲染 ---------------- */
const TITLES={dashboard:['收支概览','房产现金流总览'],records:['收支明细','查询、筛选与管理所有账目'],
  properties:['房产租约','管理房产信息、租客与租约'],reports:['统计报表','年度趋势、分类与房产对比'],
  settings:['数据管理','备份、恢复与清空本地数据']};
function render(){
  runAutoBills();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  document.getElementById('pageTitle').textContent=TITLES[currentView][0];
  document.getElementById('pageSub').textContent=TITLES[currentView][1];
  const lb=document.getElementById('lockBtn');if(lb)lb.style.display=(lockCfg&&lockCfg.hash)?'block':'none';
  ({dashboard:renderDashboard,records:renderRecords,properties:renderProperties,reports:renderReports,settings:renderSettings})[currentView]();
}
function go(v){currentView=v;render();window.scrollTo(0,0)}

/* ---------------- 全局事件 ---------------- */
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.nav-item');if(b)go(b.dataset.view);
});
document.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const id=btn.dataset.id;
  switch(btn.dataset.action){
    case'quickIn':showTxModal({type:'income'});break;
    case'quickOut':showTxModal({type:'expense'});break;
    case'quickOutFor':showTxModal({type:'expense',propertyId:id});break;
    case'editTx':showTxModal({id});break;
    case'delTx':{const t=db.transactions.find(x=>x.id===id);
      if(t&&await confirmBox(`确认删除这条 ${t.type==='income'?'收入':'支出'}记录（${money(t.amount)}，${t.date}）吗？`)){
        db.transactions=db.transactions.filter(x=>x.id!==id);save();render();toast('已删除','ok')}break;}
    case'addProp':showPropModal();break;
    case'editProp':showPropModal(id);break;
    case'addTenant':showTenantModal();break;
    case'addTenantFor':showTenantModal(null,id);break;
    case'editTenant':showTenantModal(id);break;
    case'delTenant':{const t=db.tenants.find(x=>x.id===id);
      if(t&&await confirmBox(`确认删除租客「${t.name}」的租约吗？历史账目保留。`)){
        db.tenants=db.tenants.filter(x=>x.id!==id);save();render();toast('已删除租约','ok')}break;}
    case'collectRent':{const t=db.tenants.find(x=>x.id===id);
      if(t)showTxModal({type:'income',cat:'rent',propertyId:t.propertyId,amount:t.rent,note:t.name+' 房租'});break;}
    case'goProperties':go('properties');break;
    case'exportData':exportData();break;
    case'exportCSV':exportCSV();break;
    case'meter':showMeterModal(id);break;
    case'loanPlan':showLoanModal(id);break;
    case'loadDemo':loadDemo();break;
    case'addBill':showBillModal();break;
    case'editBill':showBillModal(id);break;
    case'toggleBill':{const b=db.bills.find(x=>x.id===id);
      if(b){b.active=b.active===false;save();render();toast(b.active?'已启用周期账单':'已停用周期账单','ok')}break;}
    case'delBill':{const b=db.bills.find(x=>x.id===id);
      if(b&&await confirmBox(`确认删除周期账单「${b.name}」吗？已生成的历史账目将保留。`)){
        db.bills=db.bills.filter(x=>x.id!==id);save();render();toast('已删除周期账单','ok')}break;}
    case'saveBudgets':{const nb={};
      document.querySelectorAll('[data-bcat]').forEach(i=>{const v=parseFloat(i.value);if(v>0)nb[i.dataset.bcat]=Math.round(v*100)/100});
      db.budgets=nb;save();render();toast('预算已保存 ✓','ok');break;}
    case'meterHistory':showMeterHistory();break;
    case'delMeter':{const m=db.meters.find(x=>x.id===id);
      if(m&&await confirmBox(`确认删除 ${m.date} 的${METER_KINDS[m.kind]?.name||''}抄表记录吗？`)){
        db.meters=db.meters.filter(x=>x.id!==id);save();showMeterHistory();toast('已删除抄表记录','ok')}break;}
    case'toggleTheme':toggleTheme();break;
    case'goSettings':go('settings');break;
    case'clearAll':if(await confirmBox('将删除全部房产、租约、账目、抄表记录、周期账单与预算，且无法恢复。确认清空吗？')){
        db={properties:[],tenants:[],transactions:[],meters:[],bills:[],budgets:{}};save();render();toast('已清空全部数据','ok')}break;
  }
});
/* 双击行编辑 */
document.addEventListener('dblclick',e=>{
  const tr=e.target.closest('tr[data-id]');
  if(tr&&currentView==='records')showTxModal({id:tr.dataset.id});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('mask'); // noop

applyTheme(localStorage.getItem(THEME_KEY));
render();
if(lockCfg&&lockCfg.hash)showLock();
</script>
</body>
